<!DOCTYPE html>
<html lang="en" id="iframeHtmlRoot" class="iframe-page-root">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Iframe Page</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        font-family: Arial, Helvetica, sans-serif;
        color: #111;
        background: #f8fbff;
      }
      body.iframe-level-2 {
        background: #f4fbf8;
      }
      .level-tag {
        display: inline-block;
        margin-bottom: 10px;
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 0.8rem;
        font-weight: 700;
        color: #fff;
        background: #1d4ed8;
      }
      body.iframe-level-2 .level-tag {
        background: #047857;
      }
      .page-box {
        border: 2px solid #1d4ed8;
        border-radius: 10px;
        background: #fff;
        padding: 18px;
        max-width: 640px;
      }
      body.iframe-level-2 .page-box {
        border-color: #047857;
      }
      .page-title {
        margin: 0 0 6px;
        font-size: 1.25rem;
      }
      .page-hint {
        margin: 0 0 14px;
        color: #475569;
        font-size: 0.92rem;
      }
      .buttons-row {
        margin-bottom: 14px;
      }
      .btn {
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        background: #1d4ed8;
        color: #fff;
        cursor: pointer;
        margin-right: 8px;
        margin-bottom: 8px;
      }
      body.iframe-level-2 .btn {
        background: #047857;
      }
      .btn-secondary {
        background: #64748b;
      }
      .status-text {
        margin: 0 0 14px;
        min-height: 1.2em;
        color: #0f172a;
        font-size: 0.95rem;
      }
      .simple-form {
        padding: 14px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        background: #f8fafc;
      }
      .form-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .form-row label {
        min-width: 70px;
        font-weight: 600;
      }
      .form-row input {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid #94a3b8;
        border-radius: 4px;
      }
      .nested-block {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px dashed #1d4ed8;
      }
      body.iframe-level-2 .nested-block {
        display: none;
      }
      .nested-label {
        margin: 0 0 10px;
        font-weight: 600;
        color: #334155;
        font-size: 0.9rem;
      }
      .nested-iframe {
        width: 100%;
        height: 360px;
        border: 2px solid #047857;
        border-radius: 8px;
        background: #fff;
        display: block;
      }
    </style>
  </head>
  <body id="iframePageBody" class="iframe-page-body">
    <div id="iframePageBox" class="page-box">
      <span id="iframeLevelTag" class="level-tag">Iframe — Level 1</span>
      <h1 id="iframePageTitle" class="page-title">Simple Page</h1>
      <p id="iframePageHint" class="page-hint">
        Minimal DOM inside the iframe.
      </p>

      <div id="iframeButtonsRow" class="buttons-row">
        <button id="iframeBtnOne" class="btn" type="button">Button One</button>
        <button id="iframeBtnTwo" class="btn" type="button">Button Two</button>
        <button id="iframeBtnClear" class="btn btn-secondary" type="button">Clear</button>
      </div>
      <p id="iframeStatus" class="status-text"></p>

      <form id="iframeSimpleForm" class="simple-form" action="#">
        <div id="iframeNameRow" class="form-row">
          <label id="iframeNameLabel" for="iframeName">Name</label>
          <input type="text" id="iframeName" class="form-input" name="name" placeholder="Name" />
        </div>
        <div id="iframeEmailRow" class="form-row">
          <label id="iframeEmailLabel" for="iframeEmail">Email</label>
          <input type="email" id="iframeEmail" class="form-input" name="email" placeholder="email@example.com" />
        </div>
        <div id="iframeFormActions" class="form-row">
          <button type="submit" id="iframeSubmitBtn" class="btn">Submit</button>
          <button type="reset" id="iframeResetBtn" class="btn btn-secondary">Reset</button>
        </div>
      </form>

      <div id="iframeNestedBlock" class="nested-block">
        <p id="iframeNestedLabel" class="nested-label">↓ Nested inside Level 1:</p>
        <iframe
          id="iframeNestedFrame"
          class="nested-iframe"
          name="iframeNestedFrame"
          title="Iframe Level 2"
          src="iframe-page.html?nest=2"
        ></iframe>
      </div>
    </div>

    <script id="iframePageScript" class="inline-script">
      (function () {
        const params = new URLSearchParams(window.location.search);
        const nestLevel = parseInt(params.get('nest') || '1', 10);

        document.body.classList.add('iframe-level-' + nestLevel);
        document.body.setAttribute('data-nest-level', String(nestLevel));

        const levelTag = document.getElementById('iframeLevelTag');
        const pageTitle = document.getElementById('iframePageTitle');
        const pageHint = document.getElementById('iframePageHint');
        const nestedBlock = document.getElementById('iframeNestedBlock');
        const status = document.getElementById('iframeStatus');

        if (nestLevel >= 2) {
          if (levelTag) levelTag.textContent = 'Iframe — Level 2';
          if (pageTitle) pageTitle.textContent = 'Simple Page (Deepest)';
          if (pageHint) pageHint.textContent = 'This is Level 2. Nesting stops here.';
          if (nestedBlock) nestedBlock.hidden = true;
        } else {
          if (levelTag) levelTag.textContent = 'Iframe — Level 1';
          if (pageTitle) pageTitle.textContent = 'Simple Page';
          if (pageHint) pageHint.textContent = 'Minimal DOM inside the iframe. Level 2 is nested below.';
        }

        function setStatus(message) {
          if (status) status.textContent = message;
        }

        const btnOne = document.getElementById('iframeBtnOne');
        const btnTwo = document.getElementById('iframeBtnTwo');
        const btnClear = document.getElementById('iframeBtnClear');
        const form = document.getElementById('iframeSimpleForm');

        if (btnOne) {
          btnOne.addEventListener('click', function () {
            setStatus('Button One clicked (Iframe Level ' + nestLevel + ')');
          });
        }

        if (btnTwo) {
          btnTwo.addEventListener('click', function () {
            setStatus('Button Two clicked (Iframe Level ' + nestLevel + ')');
          });
        }

        if (btnClear) {
          btnClear.addEventListener('click', function () {
            setStatus('');
          });
        }

        if (form) {
          form.addEventListener('submit', function (event) {
            event.preventDefault();
            const name = document.getElementById('iframeName');
            const email = document.getElementById('iframeEmail');
            setStatus(
              'Form submitted (Level ' + nestLevel + '): ' +
              (name ? name.value : '') +
              ' / ' +
              (email ? email.value : '')
            );
          });
        }
      })();
    </script>
  </body>
</html>
